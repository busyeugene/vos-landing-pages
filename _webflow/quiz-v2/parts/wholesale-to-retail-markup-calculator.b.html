<script>
  (function(){
    var root = document.getElementById('vos-w2r');
    var $ = function(id){ return root.querySelector('#'+id); };
    var cost=$('vos-cost'), mymarkup=$('vos-mymarkup'), units=$('vos-units'), rmargin=$('vos-rmargin'),
        retailEl=$('vos-retail'), retailSub=$('vos-retail-sub'),
        wholeEl=$('vos-whole'), wholeSub=$('vos-whole-sub'),
        gpEl=$('vos-gp'), gpCard=$('vos-gp-card'), gpSub=$('vos-gp-sub'),
        rmarEl=$('vos-rmar'), rmarSub=$('vos-rmar-sub'),
        retailcaseEl=$('vos-retailcase'), retailcaseSub=$('vos-retailcase-sub'),
        rcostEl=$('vos-rcost'),
        tip=$('vos-tip-text');

    var DEFAULTS={'vos-cost':22,'vos-mymarkup':30,'vos-units':12,'vos-rmargin':40};

    function num(el){ var v=parseFloat(el.value); return isFinite(v)&&v>0?v:0; }
    function money2(n){
      if(!isFinite(n)) n=0;
      return (n<0?'-$':'$')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    }

    function calc(){
      var C=num(cost), U=num(units);
      var mk=parseFloat(mymarkup.value); if(!isFinite(mk)||mk<0) mk=0;
      var rm=parseFloat(rmargin.value); if(!isFinite(rm)||rm<0) rm=0; rm=Math.min(rm,99); // 100% margin is an infinite price

      // Your wholesale price, settled to whole cents first.
      var wholeCase = Math.round(C*(1+mk/100)*100)/100;
      var yourGp = wholeCase - C;
      var yourMargin = wholeCase>0 ? yourGp/wholeCase*100 : 0;

      if(U<=0 || wholeCase<=0){
        retailEl.textContent='--'; rmarEl.textContent='--'; retailcaseEl.textContent='--'; rcostEl.textContent='--';
        wholeEl.textContent = money2(wholeCase);
        wholeSub.textContent = 'Your cost plus '+mk.toFixed(0)+'% markup';
        gpEl.textContent = money2(yourGp);
        gpCard.className = 'vos-stat ' + (yourGp>=0?'vos-profit':'vos-loss');
        gpSub.textContent = 'A '+yourMargin.toFixed(1)+'% margin for you';
        retailSub.textContent = 'Enter units per case and your wholesale price';
        tip.innerHTML = 'Enter your <b>cost</b>, your <b>markup</b> and the <b>units per case</b>, and we will trace the case all the way to the shelf.';
        return;
      }

      // Retailer buys the case, splits it into units, and prices for their margin.
      var rcostUnit = wholeCase/U;
      var retailUnit = Math.round(rcostUnit/(1-rm/100)*100)/100; // shelf price, whole cents
      var rcostUnitR = Math.round(rcostUnit*100)/100;
      var rMarginUnit = Math.round((retailUnit - rcostUnitR)*100)/100; // reconciles: shelf - cost = margin on screen
      var rMarginPct = retailUnit>0 ? rMarginUnit/retailUnit*100 : 0;
      var retailCase = Math.round(retailUnit*U*100)/100;

      retailEl.textContent = money2(retailUnit);
      retailSub.textContent = 'Priced to leave a '+rm.toFixed(0)+'% retailer margin';
      wholeEl.textContent = money2(wholeCase);
      wholeSub.textContent = 'Your cost plus '+mk.toFixed(0)+'% markup';
      gpEl.textContent = money2(yourGp);
      gpCard.className = 'vos-stat ' + (yourGp>=0?'vos-profit':'vos-loss');
      gpSub.textContent = 'A '+yourMargin.toFixed(1)+'% margin for you';
      rmarEl.textContent = money2(rMarginUnit);
      rmarSub.textContent = rMarginPct.toFixed(1)+'% of the '+money2(retailUnit)+' shelf price';
      retailcaseEl.textContent = money2(retailCase);
      retailcaseSub.textContent = (U%1===0?U:U.toFixed(0))+' units at '+money2(retailUnit);
      rcostEl.textContent = money2(rcostUnitR);

      tip.innerHTML = 'At a <b>'+mk.toFixed(0)+'% markup</b> your case sells for <b>'+money2(wholeCase)+'</b>, a <b>'+yourMargin.toFixed(1)+'%</b> margin for you. Split across '+(U%1===0?U:U.toFixed(0))+' units the retailer pays <b>'+money2(rcostUnitR)+'</b> each and has to shelf it at <b>'+money2(retailUnit)+'</b> to keep a '+rm.toFixed(0)+'% margin. If that is above the competition, they will not stock you, so watch the shelf price your wholesale creates.';
    }

    [cost,mymarkup,units,rmargin].forEach(function(el){ el.addEventListener('input', calc); });

    $('vos-reset').addEventListener('click', function(){
      Object.keys(DEFAULTS).forEach(function(id){ $(id).value = DEFAULTS[id]; });
      calc();
    });

    calc();
  })();
  </script>
