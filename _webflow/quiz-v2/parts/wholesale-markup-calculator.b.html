<script>
  (function(){
    var root = document.getElementById('vos-wmarkup');
    var $ = function(id){ return root.querySelector('#'+id); };
    var cost=$('vos-cost'), pct=$('vos-pct'), slider=$('vos-slider'),
        staple=$('vos-staple'), smarkup=$('vos-smarkup'),
        priceEl=$('vos-price'), priceSub=$('vos-price-sub'),
        gpEl=$('vos-gp'), gpCard=$('vos-gp-card'),
        markupEl=$('vos-markup'), marginEl=$('vos-margin'),
        smarginEl=$('vos-smargin'), smarginSub=$('vos-smargin-sub'),
        blendedEl=$('vos-blended'), blendedSub=$('vos-blended-sub'),
        tip=$('vos-tip-text'), pctLabel=$('vos-pct-label'), pctHint=$('vos-pct-hint'),
        bMarkup=$('vos-mode-markup'), bMargin=$('vos-mode-margin');

    var DEFAULTS={'vos-cost':22,'vos-pct':35,'vos-staple':60,'vos-smarkup':18};
    var mode='markup';

    function num(el){ var v=parseFloat(el.value); return isFinite(v)&&v>0?v:0; }
    function money2(n){
      if(!isFinite(n)) n=0;
      return (n<0?'-$':'$')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    }

    function calc(){
      var C=num(cost);
      var p=parseFloat(pct.value); if(!isFinite(p)||p<0) p=0;
      var w=parseFloat(staple.value); if(!isFinite(w)||w<0) w=0; w=Math.min(w,100)/100;
      var sm=parseFloat(smarkup.value); if(!isFinite(sm)||sm<0) sm=0;

      var price;
      if(mode==='markup'){
        price = C*(1+p/100);
      } else {
        var m=Math.min(p,99.9); // 100% margin is an infinite price
        price = C/(1-m/100);
      }
      // Bill in whole cents, then derive markup, margin and profit from the
      // settled price so every figure on screen reconciles with the others.
      price = Math.round(price*100)/100;

      var gp = price - C;
      var markupImplied = C>0 ? (price-C)/C*100 : (mode==='markup'?p:0);
      var margin = price>0 ? gp/price*100 : 0;
      var sMargin = (100+sm)>0 ? sm/(100+sm)*100 : 0;
      var blended = w*sMargin + (1-w)*margin;

      priceEl.textContent = money2(price);
      priceSub.textContent = mode==='markup'
        ? 'Landed cost of '+money2(C)+' plus '+markupImplied.toFixed(0)+'% markup'
        : 'The price that hits a '+Math.min(p,99.9).toFixed(1)+'% margin';
      gpEl.textContent = money2(gp);
      gpCard.className = 'vos-stat ' + (gp>=0 ? 'vos-profit' : 'vos-loss');
      markupEl.textContent = markupImplied.toFixed(0)+'%';
      marginEl.textContent = margin.toFixed(1)+'%';
      smarginEl.textContent = sMargin.toFixed(1)+'%';
      smarginSub.textContent = 'At '+sm.toFixed(0)+'% staple markup';
      blendedEl.textContent = blended.toFixed(1)+'%';
      blendedSub.textContent = 'With staples at '+(w*100).toFixed(0)+'% of sales';

      var t;
      if(C<=0){
        t = 'Enter what a case actually costs you landed, including <b>freight</b> and <b>handling</b>. Marking up the supplier invoice alone understates your real cost.';
      } else if(mode==='markup'){
        t = 'A <b>'+markupImplied.toFixed(0)+'% markup</b> is a <b>'+margin.toFixed(1)+'%</b> margin, not '+markupImplied.toFixed(0)+'%.';
        if(w>0){
          t += ' Your staples marked up '+sm.toFixed(0)+'% hold only a <b>'+sMargin.toFixed(1)+'%</b> margin, and with staples at '+(w*100).toFixed(0)+'% of sales your blended margin is <b>'+blended.toFixed(1)+'%</b>. The price on your best items is not what you take home.';
        } else {
          t += ' Markup is measured against cost, margin against the price you bill, so the two never match.';
        }
      } else {
        t = 'To keep a <b>'+margin.toFixed(1)+'%</b> margin you have to mark landed cost up by <b>'+markupImplied.toFixed(0)+'%</b>.';
        if(w>0){
          t += ' Your staples marked up '+sm.toFixed(0)+'% only hold a <b>'+sMargin.toFixed(1)+'%</b> margin, so with staples at '+(w*100).toFixed(0)+'% of sales your blended margin drops to <b>'+blended.toFixed(1)+'%</b>.';
        }
      }
      tip.innerHTML = t;
    }

    function syncSlider(){
      var p=parseFloat(pct.value);
      if(isFinite(p)){ slider.value = Math.max(0, Math.min(100, p)); }
    }

    [cost,staple,smarkup].forEach(function(el){ el.addEventListener('input', calc); });
    pct.addEventListener('input', function(){ syncSlider(); calc(); });
    slider.addEventListener('input', function(){ pct.value = slider.value; calc(); });

    function setMode(m){
      mode=m;
      if(m==='markup'){
        bMarkup.classList.add('vos-on'); bMargin.classList.remove('vos-on');
        pctLabel.textContent='Markup on landed cost';
        pctHint.textContent='Markup is added on top of cost. It is not the same as margin.';
      } else {
        bMargin.classList.add('vos-on'); bMarkup.classList.remove('vos-on');
        pctLabel.textContent='Target margin you want to keep';
        pctHint.textContent='Margin is measured against the price you bill.';
      }
      calc();
    }
    bMarkup.addEventListener('click', function(){ setMode('markup'); });
    bMargin.addEventListener('click', function(){ setMode('margin'); });

    $('vos-reset').addEventListener('click', function(){
      Object.keys(DEFAULTS).forEach(function(id){ $(id).value = DEFAULTS[id]; });
      setMode('markup'); syncSlider(); calc();
    });

    calc();
  })();
  </script>
