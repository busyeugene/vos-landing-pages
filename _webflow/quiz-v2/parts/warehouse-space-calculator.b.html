<script>
  (function(){
    var root = document.getElementById('vos-wspace');
    var $ = function(id){ return root.querySelector('#'+id); };
    var casesEl=$('vos-cases'), cpp=$('vos-cpp'), stack=$('vos-stack'), foot=$('vos-foot'), aisle=$('vos-aisle'),
        totalEl=$('vos-total'), totalSub=$('vos-total-sub'),
        palletsEl=$('vos-pallets'), palletsSub=$('vos-pallets-sub'),
        floorEl=$('vos-floor'), floorSub=$('vos-floor-sub'),
        storageEl=$('vos-storage'), percaseEl=$('vos-percase'),
        aisleEl=$('vos-aislespace'), aisleSub=$('vos-aislespace-sub'),
        tip=$('vos-tip-text');

    var DEFAULTS={'vos-cases':3000,'vos-cpp':50,'vos-stack':2,'vos-foot':13.3,'vos-aisle':45};

    function num(el){ var v=parseFloat(el.value); return isFinite(v)&&v>0?v:0; }
    function whole(n){ if(!isFinite(n)) n=0; return Math.round(n).toLocaleString('en-US'); }
    function sqft(n){ if(!isFinite(n)) n=0; return Math.round(n).toLocaleString('en-US')+' sq ft'; }

    function calc(){
      var cs=num(casesEl), cp=num(cpp), st=Math.round(num(stack)), ft=num(foot);
      var a=parseFloat(aisle.value); if(!isFinite(a)||a<0) a=0; a=Math.min(a,95); // must leave some storage

      // No pallets to store, or missing a divisor, means no answer to give.
      if(cs<=0 || cp<=0 || st<=0 || ft<=0){
        totalEl.textContent='--'; palletsEl.textContent='--'; floorEl.textContent='--';
        storageEl.textContent='--'; percaseEl.textContent='--'; aisleEl.textContent='--';
        totalSub.textContent='Enter cases, cases per pallet, stack height and footprint';
        tip.innerHTML='Enter your <b>cases on hand</b>, how many <b>cases fit a pallet</b>, and how high you stack, and we will size the floor for you.';
        return;
      }

      var pallets = Math.ceil(cs/cp);
      var floorPos = Math.ceil(pallets/st);
      var storage = floorPos*ft;
      var total = storage/(1-a/100);
      total = Math.round(total);
      var storageR = Math.round(storage);
      var aisleSpace = total - storageR; // reconciles: storage + aisles = total on screen
      var perCase = total/cs;

      // What one more level of stacking would save.
      var floorHi = Math.ceil(pallets/(st+1));
      var totalHi = Math.round((floorHi*ft)/(1-a/100));

      totalEl.textContent = sqft(total);
      totalSub.textContent = 'Storage plus aisles, dock and staging';
      palletsEl.textContent = whole(pallets);
      palletsSub.textContent = 'At '+ (cp%1===0?cp:cp.toFixed(1)) +' cases per pallet';
      floorEl.textContent = whole(floorPos);
      floorSub.textContent = 'Stacked '+st+' high';
      storageEl.textContent = sqft(storageR);
      percaseEl.textContent = (isFinite(perCase)?perCase.toFixed(2):'0.00')+' sq ft';
      aisleEl.textContent = sqft(aisleSpace);
      aisleSub.textContent = a.toFixed(0)+'% of the building';

      tip.innerHTML = 'Aisles, dock and staging take <b>'+a.toFixed(0)+'%</b> of the floor, so nearly half the building moves no product. Stacking one pallet higher, from '+st+' to '+(st+1)+', would cut the space you need from <b>'+sqft(total)+'</b> to <b>'+sqft(totalHi)+'</b>.';
    }

    [casesEl,cpp,stack,foot,aisle].forEach(function(el){ el.addEventListener('input', calc); });

    $('vos-reset').addEventListener('click', function(){
      Object.keys(DEFAULTS).forEach(function(id){ $(id).value = DEFAULTS[id]; });
      calc();
    });

    calc();
  })();
  </script>
