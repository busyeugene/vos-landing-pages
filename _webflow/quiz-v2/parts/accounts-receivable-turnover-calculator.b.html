<script>
  (function(){
    var root = document.getElementById('vos-ar');
    var $ = function(id){ return root.querySelector('#'+id); };
    var sales=$('vos-sales'), terms=$('vos-terms'), begar=$('vos-begar'), endar=$('vos-endar'),
        rate=$('vos-rate'), cut=$('vos-cut'), cutSlider=$('vos-cut-slider'),
        turnEl=$('vos-turn'), turnSub=$('vos-turn-sub'), dsoEl=$('vos-dso'), dsoSub=$('vos-dso-sub'),
        beyondEl=$('vos-beyond'), beyondSub=$('vos-beyond-sub'), beyondCard=$('vos-beyond-card'),
        stuckEl=$('vos-stuck'), carryEl=$('vos-carry'), carrySub=$('vos-carry-sub'),
        freedEl=$('vos-freed'), freedK=$('vos-freed-k'), freedSub=$('vos-freed-sub'),
        tip=$('vos-tip-text');

    var DEFAULTS={'vos-sales':9600000,'vos-terms':30,'vos-begar':980000,'vos-endar':1060000,'vos-rate':9,'vos-cut':5};

    function num(el){ var v=parseFloat(el.value); return isFinite(v)&&v>0?v:0; }
    function money(n){ if(!isFinite(n)) n=0; return '$'+Math.round(n).toLocaleString('en-US'); }
    function days(n){ if(!isFinite(n)) n=0; return n.toFixed(1); }

    function calc(){
      var S=num(sales), T=num(terms), B=num(begar), E=num(endar), R=num(rate);
      var CUT=parseFloat(cut.value); if(!isFinite(CUT)||CUT<0) CUT=0;

      var avgAR = (B+E)/2;
      var valid = S>0 && avgAR>0;

      var turnover = valid ? S/avgAR : NaN;
      var dso      = valid ? 365*avgAR/S : NaN;
      var perDay   = S/365;                        // cash released per day of DSO cut
      var beyond   = valid ? dso - T : NaN;
      // Cash tied up beyond terms. Never negative: paying early does not owe you money.
      var stuck    = valid ? Math.max(0, beyond)/365*S : NaN;
      var carry    = valid ? stuck*(R/100) : NaN;

      if(!valid){
        turnEl.textContent='--'; dsoEl.textContent='--'; beyondEl.textContent='--';
        stuckEl.textContent='--'; carryEl.textContent='--'; freedEl.textContent='--';
        turnSub.textContent='Enter your credit sales and AR balances.';
        dsoSub.textContent=''; beyondSub.textContent=''; carrySub.textContent='';
        tip.innerHTML='Enter your <b>annual sales on credit</b> and both <b>AR balances</b> to see how fast you really collect.';
        return;
      }

      // A DSO cut can never exceed the DSO you actually have.
      var realCut = Math.min(CUT, dso);
      var freed = realCut*perDay;

      turnEl.textContent  = turnover.toFixed(1)+'x';
      turnSub.textContent = 'You collect your book '+turnover.toFixed(1)+' times a year';
      dsoEl.textContent   = days(dso)+' days';
      dsoSub.textContent  = 'Average time from invoice to cash. Average AR is '+money(avgAR)+'.';

      if(beyond>0){
        beyondEl.textContent = days(beyond)+' days';
        beyondSub.textContent= 'How far customers run past net '+T.toFixed(0);
        beyondCard.className = 'vos-stat vos-loss';
      } else {
        beyondEl.textContent = days(Math.abs(beyond))+' days early';
        beyondSub.textContent= 'You collect inside net '+T.toFixed(0)+'. Rare, and worth protecting.';
        beyondCard.className = 'vos-stat vos-profit';
      }

      stuckEl.textContent = money(stuck);
      carryEl.textContent = money(carry);
      carrySub.textContent= 'At '+R.toFixed(1)+'% cost of money';
      freedK.textContent  = 'Cash freed by collecting '+realCut.toFixed(0)+' day'+(realCut===1?'':'s')+' sooner';
      freedEl.textContent = money(freed);
      freedSub.textContent= 'One-time cash release, plus '+money(freed*(R/100))+' a year in interest you stop paying';

      // Dynamic tip: benchmark against terms first, then against the industry norm.
      var t;
      if(beyond>14){
        t = 'You write net '+T.toFixed(0)+' but collect in <b>'+days(dso)+' days</b>, more than two weeks past terms. <b>'+money(stuck)+'</b> of your cash is financing your customers and it costs you <b>'+money(carry)+'</b> a year. At this gap the problem is usually process, not credit risk: late invoices, wrong quantities, and disputed deliveries.';
      } else if(beyond>0){
        t = 'You write net '+T.toFixed(0)+' but collect in <b>'+days(dso)+' days</b>. That gap leaves <b>'+money(stuck)+'</b> of your cash on someone else\'s balance sheet and costs you <b>'+money(carry)+'</b> a year to finance. Most of it is not customers refusing to pay, it is invoices that went out late or wrong.';
      } else if(turnover>=12){
        t = 'A turnover of <b>'+turnover.toFixed(1)+'x</b> means you collect your whole book more than once a month, inside your own terms. That is strong for food distribution. Guard it: every day of DSO you give back costs you <b>'+money(perDay)+'</b> in cash.';
      } else {
        t = 'You collect in <b>'+days(dso)+' days</b>, inside your net '+T.toFixed(0)+' terms. Good. Keep an eye on the trend rather than the snapshot: every extra day of DSO ties up another <b>'+money(perDay)+'</b> of cash.';
      }
      tip.innerHTML = t;
    }

    function syncSlider(){
      var v = parseFloat(cut.value);
      if(isFinite(v)){ cutSlider.value = Math.max(0, Math.min(30, v)); }
    }

    [sales,terms,begar,endar,rate].forEach(function(el){ el.addEventListener('input', calc); });
    cut.addEventListener('input', function(){ syncSlider(); calc(); });
    cutSlider.addEventListener('input', function(){ cut.value = cutSlider.value; calc(); });

    $('vos-reset').addEventListener('click', function(){
      Object.keys(DEFAULTS).forEach(function(id){ $(id).value = DEFAULTS[id]; });
      syncSlider(); calc();
    });

    calc();
  })();
  </script>
