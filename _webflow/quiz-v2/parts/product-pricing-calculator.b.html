<script>
  (function(){
    var root = document.getElementById('vos-pricing');
    var $ = function(id){ return root.querySelector('#'+id); };
    var cost=$('vos-cost'), vol=$('vos-vol'), margin=$('vos-margin'), profit=$('vos-profit'), comp=$('vos-comp'),
        pMarginEl=$('vos-p-margin'), pMarginSub=$('vos-p-margin-sub'),
        pProfitEl=$('vos-p-profit'), pProfitSub=$('vos-p-profit-sub'),
        pCompEl=$('vos-p-comp'), pCompSub=$('vos-p-comp-sub'), pCompCard=$('vos-p-comp-card'),
        thinEl=$('vos-thin'), thinSub=$('vos-thin-sub'),
        spreadEl=$('vos-spread'), spreadSub=$('vos-spread-sub'),
        monthlyEl=$('vos-monthly'), monthlySub=$('vos-monthly-sub'),
        tip=$('vos-tip-text');

    var DEFAULTS={'vos-cost':22,'vos-vol':6000,'vos-margin':28,'vos-profit':8,'vos-comp':31};

    function num(el){ var v=parseFloat(el.value); return isFinite(v)&&v>0?v:0; }
    function money2(n){
      if(!isFinite(n)) n=0;
      return (n<0?'-$':'$')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    }
    function money(n){ if(!isFinite(n)) n=0; return (n<0?'-$':'$')+Math.abs(Math.round(n)).toLocaleString('en-US'); }
    function cases(n){ if(!isFinite(n)) n=0; return Math.round(n).toLocaleString('en-US'); }

    function calc(){
      var C=num(cost), V=num(vol), pr=num(profit), cp=num(comp);
      var m=parseFloat(margin.value); if(!isFinite(m)||m<0) m=0; m=Math.min(m,99);

      if(C<=0){
        [pMarginEl,pProfitEl,pCompEl,thinEl,spreadEl,monthlyEl].forEach(function(e){ e.textContent='--'; });
        pMarginSub.textContent='Enter your cost per case to price it';
        tip.innerHTML='Enter your <b>cost per case</b>, then set a margin, a target profit, or a competitor price to compare the three.';
        return;
      }

      // Each method settles to whole cents, then its margin and profit derive from
      // that price so the card reconciles (price - cost = profit shown).
      var priceMargin = Math.round(C/(1-m/100)*100)/100;
      var priceProfit = Math.round((C+pr)*100)/100;
      var priceComp   = Math.round(cp*100)/100;

      function marg(p){ return p>0 ? (p-C)/p*100 : 0; }
      var mMargin=marg(priceMargin), mProfit=marg(priceProfit), mComp=marg(priceComp);
      var gpMargin=priceMargin-C, gpProfit=priceProfit-C, gpComp=priceComp-C;

      pMarginEl.textContent = money2(priceMargin);
      pMarginSub.textContent = mMargin.toFixed(1)+'% margin, '+money2(gpMargin)+' profit per case';
      pProfitEl.textContent = money2(priceProfit);
      pProfitSub.textContent = mProfit.toFixed(1)+'% margin, '+money2(gpProfit)+' profit per case';
      pCompEl.textContent = money2(priceComp);
      pCompSub.textContent = mComp.toFixed(1)+'% margin, '+money2(gpComp)+' profit per case';
      pCompCard.className = 'vos-stat' + (gpComp>=0 ? '' : ' vos-loss');

      // Thinnest margin and the price spread across the three methods.
      var methods=[{n:'the cost-plus price',m:mMargin,p:priceMargin},
                   {n:'the target-profit price',m:mProfit,p:priceProfit},
                   {n:'the match-competitor price',m:mComp,p:priceComp}];
      var thin=methods[0], hi=priceMargin, lo=priceMargin;
      methods.forEach(function(x){ if(x.m<thin.m) thin=x; if(x.p>hi) hi=x.p; if(x.p<lo) lo=x.p; });
      thinEl.textContent = thin.m.toFixed(1)+'%';
      thinSub.textContent = 'From '+thin.n;
      spreadEl.textContent = money2(hi-lo);
      spreadSub.textContent = money2(lo)+' to '+money2(hi)+' across methods';

      var monthly = gpMargin*V;
      monthlyEl.textContent = money(monthly);
      monthlySub.textContent = 'Across '+cases(V)+' cases';

      tip.innerHTML = 'Three ways to price the same <b>'+money2(C)+'</b> case give three answers: <b>'+money2(priceMargin)+'</b> for a '+m.toFixed(0)+'% margin, <b>'+money2(priceProfit)+'</b> to make '+money2(pr)+' a case, and <b>'+money2(priceComp)+'</b> to match a competitor. The lowest-margin method is '+thin.n+' at <b>'+thin.m.toFixed(1)+'%</b>, so the cheapest-looking price is rarely the most profitable.';
    }

    [cost,vol,margin,profit,comp].forEach(function(el){ el.addEventListener('input', calc); });

    $('vos-reset').addEventListener('click', function(){
      Object.keys(DEFAULTS).forEach(function(id){ $(id).value = DEFAULTS[id]; });
      calc();
    });

    calc();
  })();
  </script>
