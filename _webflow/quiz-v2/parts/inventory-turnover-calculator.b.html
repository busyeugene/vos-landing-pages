<script>
  (function(){
    var root = document.getElementById('vos-invturn');
    var $ = function(id){ return root.querySelector('#'+id); };
    var cogs=$('vos-cogs'), avginv=$('vos-avginv'), carry=$('vos-carry'), cut=$('vos-cut'), cutSlider=$('vos-cut-slider'),
        turnEl=$('vos-turn'), dioEl=$('vos-dio'), cashEl=$('vos-cash'),
        carryEl=$('vos-carrycost'), carrySub=$('vos-carrycost-sub'),
        freedEl=$('vos-freed'), freedSub=$('vos-freed-sub'), savedEl=$('vos-carrysaved'),
        tip=$('vos-tip-text');

    var DEFAULTS={'vos-cogs':1584000,'vos-avginv':132000,'vos-carry':25,'vos-cut':5};

    function num(el){ var v=parseFloat(el.value); return isFinite(v)&&v>0?v:0; }
    function money(n){ if(!isFinite(n)) n=0; return '$'+Math.round(n).toLocaleString('en-US'); }

    function calc(){
      var COGS=num(cogs), INV=num(avginv);
      var cr=parseFloat(carry.value); if(!isFinite(cr)||cr<0) cr=0;
      var days=parseFloat(cut.value); if(!isFinite(days)||days<0) days=0;

      // Cash tied up and carrying cost stand on their own even without a turnover.
      cashEl.textContent = money(INV);
      var carryCost = INV*cr/100;
      carryEl.textContent = money(carryCost);
      carrySub.textContent = 'At '+cr.toFixed(0)+'% of inventory value';

      if(COGS<=0 || INV<=0){
        turnEl.textContent='--'; dioEl.textContent='--';
        freedEl.textContent='--'; savedEl.textContent='--';
        freedSub.textContent='Enter COGS and inventory first';
        tip.innerHTML='Enter your annual <b>COGS</b> and <b>average inventory</b>, both at cost, and we will work out your turns and the cash they tie up.';
        return;
      }

      var turnover = COGS/INV;
      var dio = 365/turnover; // = 365 * INV / COGS
      // Cannot turn faster than the stock currently sits.
      var d = Math.min(days, dio);
      var perDay = COGS/365;
      var freed = d*perDay;
      var saved = freed*cr/100;

      turnEl.textContent = turnover.toFixed(1)+'x';
      dioEl.textContent = dio.toFixed(1)+' days';
      freedEl.textContent = money(freed);
      freedSub.textContent = 'By trimming '+d.toFixed(0)+' days of stock';
      savedEl.textContent = money(saved);

      tip.innerHTML = 'You turn inventory <b>'+turnover.toFixed(1)+'</b> times a year, so a case sits about <b>'+dio.toFixed(0)+' days</b> before it sells. That parks <b>'+money(INV)+'</b> in stock and costs about <b>'+money(carryCost)+'</b> a year to carry at '+cr.toFixed(0)+'%. Turning <b>'+d.toFixed(0)+' days</b> faster would free <b>'+money(freed)+'</b> and save <b>'+money(saved)+'</b> a year in carrying.';
    }

    function syncSlider(){ var v=parseFloat(cut.value); if(isFinite(v)) cutSlider.value=Math.max(0,Math.min(30,v)); }
    [cogs,avginv,carry].forEach(function(el){ el.addEventListener('input', calc); });
    cut.addEventListener('input', function(){ syncSlider(); calc(); });
    cutSlider.addEventListener('input', function(){ cut.value=cutSlider.value; calc(); });

    $('vos-reset').addEventListener('click', function(){
      Object.keys(DEFAULTS).forEach(function(id){ $(id).value = DEFAULTS[id]; });
      syncSlider(); calc();
    });

    calc();
  })();
  </script>
