<script>
  (function(){
    var root = document.getElementById('vos-wsize');
    var $ = function(id){ return root.querySelector('#'+id); };
    var bldg=$('vos-bldg'), usable=$('vos-usable'), foot=$('vos-foot'), stack=$('vos-stack'),
        cpp=$('vos-cpp'), through=$('vos-through'),
        casesEl=$('vos-cases'), casesSub=$('vos-cases-sub'),
        positionsEl=$('vos-positions'), positionsSub=$('vos-positions-sub'),
        storageEl=$('vos-storage'), storageSub=$('vos-storage-sub'),
        floorEl=$('vos-floor'),
        weeksEl=$('vos-weeks'), weeksSub=$('vos-weeks-sub'),
        nonstorageEl=$('vos-nonstorage'),
        tip=$('vos-tip-text');

    var DEFAULTS={'vos-bldg':3000,'vos-usable':55,'vos-foot':13.3,'vos-stack':2,'vos-cpp':50,'vos-through':6000};
    var WEEKS_PER_MONTH = 52/12; // 4.3333

    function num(el){ var v=parseFloat(el.value); return isFinite(v)&&v>0?v:0; }
    function whole(n){ if(!isFinite(n)) n=0; return Math.round(n).toLocaleString('en-US'); }
    function sqft(n){ if(!isFinite(n)) n=0; return Math.round(n).toLocaleString('en-US')+' sq ft'; }

    function calc(){
      var B=num(bldg), ft=num(foot), st=Math.round(num(stack)), cp=num(cpp), thr=num(through);
      var u=parseFloat(usable.value); if(!isFinite(u)||u<0) u=0; u=Math.min(u,100);

      if(B<=0 || ft<=0 || st<=0 || cp<=0 || u<=0){
        casesEl.textContent='--'; positionsEl.textContent='--'; storageEl.textContent='--';
        floorEl.textContent='--'; weeksEl.textContent='--'; nonstorageEl.textContent='--';
        casesSub.textContent='Enter building size, usable share, footprint and stack height';
        tip.innerHTML='Enter your <b>building size</b> and the share <b>usable for storage</b>, and we will turn it into cases and weeks of stock.';
        return;
      }

      var storage = B*u/100;
      var floorPos = Math.floor(storage/ft);
      var positions = floorPos*st;
      var cases = positions*cp;
      var storageR = Math.round(storage);
      var nonstorage = Math.round(B) - storageR; // reconciles with the building total on screen

      casesEl.textContent = whole(cases)+' cases';
      casesSub.textContent = 'At '+(cp%1===0?cp:cp.toFixed(1))+' cases per pallet';
      positionsEl.textContent = whole(positions);
      positionsSub.textContent = whole(floorPos)+' floor spots, '+st+' high';
      storageEl.textContent = sqft(storageR);
      storageSub.textContent = u.toFixed(0)+'% of the building';
      floorEl.textContent = whole(floorPos);
      nonstorageEl.textContent = sqft(nonstorage);

      // Capacity turns into weeks of cover only if product is actually moving.
      var casesHi = Math.floor(storage/ft)*(st+1)*cp;
      var added = casesHi - cases;
      if(thr>0){
        var weeks = cases/(thr/WEEKS_PER_MONTH);
        weeksEl.textContent = weeks.toFixed(1)+' weeks';
        weeksSub.textContent = 'At '+whole(thr)+' cases a month';
        tip.innerHTML = 'Your <b>'+sqft(Math.round(B))+'</b> holds about <b>'+whole(cases)+' cases</b>, roughly <b>'+weeks.toFixed(1)+' weeks</b> of flow at '+whole(thr)+' a month. Racking one pallet higher, from '+st+' to '+(st+1)+', would add about <b>'+whole(added)+' cases</b> without adding a square foot.';
      } else {
        weeksEl.textContent = '--';
        weeksSub.textContent = 'Enter your monthly throughput';
        tip.innerHTML = 'Your <b>'+sqft(Math.round(B))+'</b> holds about <b>'+whole(cases)+' cases</b>. Racking one pallet higher, from '+st+' to '+(st+1)+', would add about <b>'+whole(added)+' cases</b> without adding a square foot.';
      }
    }

    [bldg,usable,foot,stack,cpp,through].forEach(function(el){ el.addEventListener('input', calc); });

    $('vos-reset').addEventListener('click', function(){
      Object.keys(DEFAULTS).forEach(function(id){ $(id).value = DEFAULTS[id]; });
      calc();
    });

    calc();
  })();
  </script>
