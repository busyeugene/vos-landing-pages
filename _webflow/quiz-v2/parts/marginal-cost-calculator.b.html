<script>
  (function(){
    var root = document.getElementById('vos-marginal');
    var $ = function(id){ return root.querySelector('#'+id); };
    var fc=$('vos-fc'), vc=$('vos-vc'), q1=$('vos-q1'), q2=$('vos-q2'),
        step=$('vos-step'), price=$('vos-price'),
        mcEl=$('vos-mc'), mcSub=$('vos-mc-sub'), deltaEl=$('vos-delta'),
        deltaSub=$('vos-delta-sub'), deltaCard=$('vos-delta-card'),
        spreadEl=$('vos-spread'), beEl=$('vos-be'), beSub=$('vos-be-sub'),
        avgEl=$('vos-avg'), cmEl=$('vos-cm'), tip=$('vos-tip-text');

    var DEFAULTS={'vos-fc':48000,'vos-vc':18,'vos-q1':6000,'vos-q2':7200,'vos-step':6000,'vos-price':28};

    function num(el){ var v=parseFloat(el.value); return isFinite(v)&&v>0?v:0; }
    function money(n){ if(!isFinite(n)) n=0; return '$'+Math.round(n).toLocaleString('en-US'); }
    function money2(n){
      if(!isFinite(n)) n=0;
      return '$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    }
    function signed(n){ if(!isFinite(n)) n=0; return (n>=0?'+':'-')+money(Math.abs(n)); }
    function cases(n){ if(!isFinite(n)) n=0; return Math.ceil(n).toLocaleString('en-US'); }

    function calc(){
      var F=num(fc), V=num(vc), Q1=num(q1), Q2=num(q2), S=num(step), P=num(price);
      var addQ = Q2-Q1;

      var costBefore = F + V*Q1;
      var costAfter  = F + S + V*Q2;
      var profitBefore = P*Q1 - costBefore;
      var profitAfter  = P*Q2 - costAfter;
      var deltaProfit  = profitAfter - profitBefore;
      var cm = P - V;

      // Marginal cost only means something when volume actually goes up.
      var mc = addQ > 0 ? (costAfter - costBefore)/addQ : NaN;
      var avgBefore = Q1 > 0 ? costBefore/Q1 : NaN;
      var avgAfter  = Q2 > 0 ? costAfter/Q2  : NaN;
      var be = cm > 0 ? S/cm : NaN;

      if(addQ <= 0){
        mcEl.textContent = '--';
        mcSub.textContent = 'Set a new volume higher than your current volume.';
        spreadEl.textContent = '--';
      } else {
        mcEl.textContent = money2(mc);
        mcSub.textContent = 'What each of the '+cases(addQ)+' extra cases actually costs you';
        spreadEl.textContent = (P-mc>=0?'':'-')+money2(P-mc);
      }

      deltaEl.textContent = signed(deltaProfit);
      deltaSub.textContent = money(profitBefore)+' today, '+money(profitAfter)+' after';
      deltaCard.className = 'vos-stat ' + (deltaProfit>=0 ? 'vos-profit' : 'vos-loss');

      if(!isFinite(be)){
        beEl.textContent = '--';
        beSub.textContent = 'Your price does not cover the variable cost per case.';
      } else if(S<=0){
        beEl.textContent = '0';
        beSub.textContent = 'No new fixed costs, so every extra case adds profit.';
      } else {
        beEl.textContent = cases(be);
        beSub.textContent = 'To cover the '+money(S)+' of added overhead';
      }

      avgEl.textContent = (isFinite(avgBefore)?money2(avgBefore):'--') + ' → ' + (isFinite(avgAfter)?money2(avgAfter):'--');
      cmEl.textContent  = (cm>=0?'':'-')+money2(cm);

      // Dynamic tip: pick the most useful warning for the numbers on screen.
      var t;
      if(addQ <= 0){
        t = 'Enter a <b>new total volume</b> above your current volume to see what the extra cases cost.';
      } else if(cm <= 0){
        t = 'At <b>'+money2(P)+'</b> a case you are not even covering the <b>'+money2(V)+'</b> variable cost. Every case you add loses money, no matter how much volume you push.';
      } else if(mc >= P){
        t = 'Each extra case costs <b>'+money2(mc)+'</b> but sells for <b>'+money2(P)+'</b>. This volume loses money. You need about <b>'+cases(be)+' cases</b> to cover the '+money(S)+' of new overhead, not '+cases(addQ)+'.';
      } else if(isFinite(avgBefore) && mc < avgBefore){
        t = 'Your average cost is <b>'+money2(avgBefore)+'</b> per case, but the next case only costs <b>'+money2(mc)+'</b>. Price off the average and you will turn down volume that would have made you money.';
      } else {
        t = 'The extra volume pushes your marginal cost to <b>'+money2(mc)+'</b>, above your <b>'+money2(avgBefore)+'</b> average. The new overhead is outrunning the volume. Fill the truck before you buy another one.';
      }
      tip.innerHTML = t;
    }

    [fc,vc,q1,q2,step,price].forEach(function(el){ el.addEventListener('input', calc); });

    $('vos-reset').addEventListener('click', function(){
      Object.keys(DEFAULTS).forEach(function(id){ $(id).value = DEFAULTS[id]; });
      calc();
    });

    calc();
  })();
  </script>

  "verdict": function (read) {
    var signed = function (s) {
      var str = String(s).trim();
      var n = parseFloat(str.replace(/[^0-9.]/g, ''));
      if (!isFinite(n)) n = 0;
      return str.charAt(0) === '-' ? -n : n;
    };
    var plain = function (s) {
      var n = parseFloat(String(s).replace(/[^0-9.]/g, ''));
      return isFinite(n) ? n : 0;
    };

    if (read['vos-mc'] === '--') {
      return { tone: 'is-wait', title: 'Nothing to weigh up yet.',
        text: 'Go back and enter the extra cases a month you are being offered.' };
    }
    var delta = signed(read['vos-delta']);
    var mc = plain(read['vos-mc']);
    var avgBefore = plain(String(read['vos-avg']).split('→')[0]);

    if (delta <= 0) {
      return { tone: 'is-no', title: 'Not at this price.',

            + 'profit by ' + read['vos-delta'] + '. You would need about ' + read['vos-be']
            + ' extra cases just to carry the overhead it brings.' };
    }
    if (avgBefore && mc < avgBefore) {

        text: 'Each extra case costs ' + read['vos-mc'] + ', well under your '
            + String(read['vos-avg']).split('→')[0].trim() + ' average, and the volume adds '
            + read['vos-delta'].replace('+', '') + ' a month to profit.' };

      text: 'The volume adds ' + read['vos-delta'].replace('+', '') + ' a month, but each extra case '
