<script>
  (function(){
    var root = document.getElementById('vos-delivery');
    var $ = function(id){ return root.querySelector('#'+id); };
    var wage=$('vos-dc-wage'), hours=$('vos-dc-hours'), miles=$('vos-dc-miles'),
        mpg=$('vos-dc-mpg'), fuel=$('vos-dc-fuel'), fixed=$('vos-dc-fixed'),
        drops=$('vos-dc-drops'), cases=$('vos-dc-cases'), days=$('vos-dc-days'),
        perDropEl=$('vos-dc-perdrop'), perDropSub=$('vos-dc-perdrop-sub'),
        totalEl=$('vos-dc-total'), totalSub=$('vos-dc-total-sub'),
        perCaseEl=$('vos-dc-percase'), perCaseSub=$('vos-dc-percase-sub'),
        perMileEl=$('vos-dc-permile'), perMileSub=$('vos-dc-permile-sub'),
        fuelCostEl=$('vos-dc-fuelcost'), fuelCostSub=$('vos-dc-fuelcost-sub'),
        monthlyEl=$('vos-dc-monthly'), monthlySub=$('vos-dc-monthly-sub'),
        tip=$('vos-tip-text');

    var DEFAULTS={'vos-dc-wage':28.00,'vos-dc-hours':8,'vos-dc-miles':120,'vos-dc-mpg':8,
                  'vos-dc-fuel':4.10,'vos-dc-fixed':95.00,'vos-dc-drops':14,
                  'vos-dc-cases':420,'vos-dc-days':22};

    function num(el){ var v=parseFloat(el.value); return isFinite(v)&&v>0?v:0; }
    function money2(n){ if(!isFinite(n)) n=0; return (n<0?'-$':'$')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
    function money(n){ if(!isFinite(n)) n=0; return (n<0?'-$':'$')+Math.abs(Math.round(n)).toLocaleString('en-US'); }
    function cents(n){ return Math.round(n*100)/100; }
    function tidy(n){ return n===Math.round(n) ? Math.round(n).toLocaleString('en-US') : n.toFixed(1); }

    function calc(){
      var W=num(wage), H=num(hours), M=num(miles), G=num(mpg), F=num(fuel),
          X=num(fixed), D=num(drops), K=num(cases), N=num(days);

      // Settle every cost line to whole cents before adding them, and settle the
      // day total before dividing it, so the per drop, per case and per mile cards
      // all come off the same $380.50 a reader can see on screen and add back up.
      var labor   = cents(W*H);
      var gallons = G>0 ? M/G : 0;
      var fuelCst = cents(gallons*F);
      var total   = cents(labor + fuelCst + X);

      fuelCostEl.textContent = money2(fuelCst);
      fuelCostSub.textContent = G>0
        ? tidy(gallons)+' gallons at '+money2(F)+' a gallon'
        : 'Enter miles per gallon to cost the fuel';

      if(total<=0){
        [perDropEl,totalEl,perCaseEl,perMileEl,monthlyEl].forEach(function(e){ e.textContent='--'; });
        perDropSub.textContent='Enter a driver cost, fuel or a vehicle cost to start';
        totalSub.textContent='';
        perCaseSub.textContent='';
        perMileSub.textContent='';
        monthlySub.textContent='';
        tip.innerHTML='Put in what the <b>driver</b>, the <b>fuel</b> and the <b>truck</b> cost for one day, then the drops on the route, and the calculator splits the day across them.';
        return;
      }

      var perDrop = D>0 ? cents(total/D) : 0;
      var perCase = K>0 ? cents(total/K) : 0;
      var perMile = M>0 ? cents(total/M) : 0;
      var monthly = total*N;

      totalEl.textContent = money2(total);
      totalSub.textContent = money2(labor)+' driver, '+money2(fuelCst)+' fuel, '+money2(X)+' vehicle';

      if(D>0){
        perDropEl.textContent = money2(perDrop);
        perDropSub.textContent = money2(total)+' of route cost across '+tidy(D)+' drops';
      } else {
        perDropEl.textContent = '--';
        perDropSub.textContent = 'Enter the drops on the route to cost a delivery';
      }

      perCaseEl.textContent = K>0 ? money2(perCase) : '--';
      if(K<=0){
        perCaseSub.textContent = 'Enter the cases on the truck to split the day by case';
      } else if(D>0){
        perCaseSub.textContent = money2(total)+' across '+tidy(K)+' cases, about '+tidy(Math.round(K/D))+' a drop';
      } else {
        perCaseSub.textContent = money2(total)+' across '+tidy(K)+' cases';
      }

      perMileEl.textContent = M>0 ? money2(perMile) : '--';
      perMileSub.textContent = M>0 ? 'Across '+tidy(M)+' route miles' : 'Enter the route miles to cost a mile';
      monthlyEl.textContent = money(monthly);
      monthlySub.textContent = N>0 ? 'At '+tidy(N)+' route days a month' : 'Enter the route days to see a month';

      // The teaching tip: the cost of a stop barely moves with what is on the
      // pallet, so a light drop carries a far heavier cost per case than the
      // route average, which is the whole argument for an order minimum.
      if(D<=0){
        tip.innerHTML='Enter the <b>drops on the route</b> to see what one delivery costs. That number is the floor a delivery charge or an order minimum has to clear.';
      } else if(K<=0){
        tip.innerHTML='A drop costs <b>'+money2(perDrop)+'</b> before a single case comes off the truck. Add the <b>cases on the truck</b> to see how fast that spreads out.';
      } else {
        var light = Math.max(1, Math.round(K/D/3));
        var heavy = light*5;
        var lightPerCase = cents(perDrop/light);
        tip.innerHTML='The drop costs <b>'+money2(perDrop)+'</b> whether it is '+tidy(light)+' cases or '+tidy(heavy)+'. At '+tidy(light)+' cases that is <b>'+money2(lightPerCase)+'</b> a case against a <b>'+money2(perCase)+'</b> average, which is what a delivery minimum is actually for.';
      }
    }

    [wage,hours,miles,mpg,fuel,fixed,drops,cases,days].forEach(function(el){ el.addEventListener('input', calc); });

    $('vos-reset').addEventListener('click', function(){
      Object.keys(DEFAULTS).forEach(function(id){ $(id).value = DEFAULTS[id]; });
      calc();
    });

    calc();
  })();
  </script>
