<script>
  (function(){
    var root = document.getElementById('vos-foodmarkup');
    var $ = function(id){ return root.querySelector('#'+id); };
    var cost=$('vos-fm-cost'), weight=$('vos-fm-weight'),
        yieldEl=$('vos-fm-yield'), yieldSlider=$('vos-fm-yield-slider'),
        marginEl=$('vos-fm-margin'), cases=$('vos-fm-cases'),
        priceEl=$('vos-fm-price'), priceSub=$('vos-fm-price-sub'),
        costUsableEl=$('vos-fm-costusable'), costUsableSub=$('vos-fm-costusable-sub'),
        usableEl=$('vos-fm-usable'), usableSub=$('vos-fm-usable-sub'),
        boughtEl=$('vos-fm-bought'), boughtSub=$('vos-fm-bought-sub'), boughtCard=$('vos-fm-bought-card'),
        revenueEl=$('vos-fm-revenue'), revenueSub=$('vos-fm-revenue-sub'),
        profitEl=$('vos-fm-profit'), profitSub=$('vos-fm-profit-sub'),
        foodcostEl=$('vos-fm-foodcost'), foodcostSub=$('vos-fm-foodcost-sub'),
        monthlyEl=$('vos-fm-monthly'), monthlySub=$('vos-fm-monthly-sub'),
        monthlyCard=$('vos-fm-monthly-card'),
        tip=$('vos-tip-text');

    var DEFAULTS={'vos-fm-cost':'48.00','vos-fm-weight':'40','vos-fm-yield':'85','vos-fm-margin':'32','vos-fm-cases':'400'};

    function num(el){ var v=parseFloat(el.value); return isFinite(v)&&v>0?v:0; }
    function money2(n){ if(!isFinite(n)) n=0; return (n<0?'-$':'$')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
    function money(n){ if(!isFinite(n)) n=0; return (n<0?'-$':'$')+Math.abs(Math.round(n)).toLocaleString('en-US'); }
    function cents(n){ if(!isFinite(n)) return 0; return Math.round(n*100)/100; }
    function pn(n){ if(!isFinite(n)) n=0; return n===Math.round(n)?String(Math.round(n)):n.toFixed(1); }
    function lb(n){ if(!isFinite(n)) n=0; return Math.abs(n-Math.round(n))<0.005?String(Math.round(n)):n.toFixed(2); }

    function calc(){
      var C=num(cost), W=num(weight), K=num(cases);
      var Y=parseFloat(yieldEl.value); if(!isFinite(Y)||Y<0) Y=0; if(Y>100) Y=100;
      var M=parseFloat(marginEl.value); if(!isFinite(M)||M<0) M=0; if(M>99) M=99;

      // The usable weight is settled to a hundredth of a pound before it divides
      // anything, so the pound figures on screen are the pounds the math used.
      var usable = Math.round(W*Y)/100;
      var trim = cents(W - usable);

      if(C<=0 || W<=0 || usable<=0){
        [priceEl,costUsableEl,usableEl,boughtEl,revenueEl,profitEl,foodcostEl,monthlyEl]
          .forEach(function(e){ e.textContent='--'; });
        priceSub.textContent='Enter a case cost, a case weight and a yield above zero';
        costUsableSub.textContent=''; usableSub.textContent=''; boughtSub.textContent='';
        revenueSub.textContent=''; profitSub.textContent=''; foodcostSub.textContent='';
        monthlySub.textContent='';
        boughtCard.className='vos-stat'; monthlyCard.className='vos-stat';
        tip.innerHTML='Enter the <b>case cost</b>, the <b>case weight</b> and the <b>yield</b> to price off the pounds you can actually sell.';
        return;
      }

      // Settle each price to whole cents, then build everything downstream from the
      // settled value, so the cards reconcile on screen: revenue less the case cost
      // is the profit card, and the price gap times the usable weight is the money
      // the trim hides. The target price itself is solved from the exact case cost
      // over the usable pounds, because that is the figure that lands the margin.
      var costBought = cents(C/W);
      var costUsable = cents(C/usable);
      var price = cents((C/usable)/(1-M/100));
      var priceBought = cents(costBought/(1-M/100));
      var shortLb = cents(price - priceBought);
      var shortCase = cents(shortLb*usable);
      var revenue = cents(price*usable);
      var profit = cents(revenue - C);
      var marginPct = revenue>0 ? profit/revenue*100 : 0;
      var foodPct = revenue>0 ? C/revenue*100 : 0;
      var monthly = profit*K;

      priceEl.textContent = money2(price);
      priceSub.textContent = 'Hits a '+pn(M)+'% margin on the '+lb(usable)+' lb you can sell';
      costUsableEl.textContent = money2(costUsable);
      costUsableSub.textContent = 'The '+money2(C)+' case spread over '+lb(usable)+' usable lb';
      usableEl.textContent = lb(usable)+' lb';
      usableSub.textContent = lb(W)+' lb bought at '+pn(Y)+'% yield, so '+lb(trim)+' lb of trim';
      boughtEl.textContent = money2(priceBought);
      boughtSub.textContent = shortLb>0
        ? money2(costBought)+' a bought lb at the same margin, '+money2(shortLb)+' a lb short'
        : 'No trim at this yield, so the bought lb and the usable lb price the same';
      boughtCard.className = 'vos-stat' + (shortLb>0?' vos-loss':'');
      revenueEl.textContent = money2(revenue);
      revenueSub.textContent = money2(price)+' across '+lb(usable)+' usable lb';
      profitEl.textContent = money2(profit);
      profitSub.textContent = money2(revenue)+' less the '+money2(C)+' case, a '+marginPct.toFixed(1)+'% margin';
      foodcostEl.textContent = foodPct.toFixed(1)+'%';
      foodcostSub.textContent = money2(C)+' of the '+money2(revenue)+' the case sells for';
      monthlyEl.textContent = money(monthly);
      monthlySub.textContent = 'At '+Math.round(K).toLocaleString('en-US')+' cases a month';
      monthlyCard.className = 'vos-stat' + (monthly>0?' vos-profit':(monthly<0?' vos-loss':''));

      // The teaching tip: the markup has to sit on the usable pounds, because the
      // trim is already paid for and never gets sold.
      if(trim<=0){
        tip.innerHTML='At <b>'+pn(Y)+'%</b> yield there is no trim, so the pound you buy and the pound you sell cost the same. Weigh a few cases before you trust that.';
      } else if(shortLb<=0){
        tip.innerHTML='Trim is <b>'+lb(trim)+' lb</b> of every case. At this margin the two prices round to the same cent, but that trim is still '+money2(cents(costBought*trim))+' of cost you carry on every case.';
      } else {
        tip.innerHTML='Trim is <b>'+lb(trim)+' lb</b> of every case. Price off the <b>'+lb(W)+' lb</b> you bought and you are <b>'+money2(shortLb)+'</b> a lb short, which is <b>'+money2(shortCase)+'</b> a case you never see.';
      }
    }

    function syncSlider(){ var v=parseFloat(yieldEl.value); if(isFinite(v)) yieldSlider.value=Math.max(40,Math.min(100,v)); }
    [cost,weight,marginEl,cases].forEach(function(el){ el.addEventListener('input', calc); });
    yieldEl.addEventListener('input', function(){ syncSlider(); calc(); });
    yieldSlider.addEventListener('input', function(){ yieldEl.value=yieldSlider.value; calc(); });

    $('vos-reset').addEventListener('click', function(){
      Object.keys(DEFAULTS).forEach(function(id){ $(id).value = DEFAULTS[id]; });
      syncSlider(); calc();
    });

    calc();
  })();
  </script>
