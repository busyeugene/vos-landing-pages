<script>
  (function(){
    var root = document.getElementById('vos-unit');
    var $ = function(id){ return root.querySelector('#'+id); };
    var aPrice=$('vos-a-price'), aUnits=$('vos-a-units'), aSize=$('vos-a-size'),
        bPrice=$('vos-b-price'), bUnits=$('vos-b-units'), bSize=$('vos-b-size'),
        bestEl=$('vos-best'), bestSub=$('vos-best-sub'),
        gapEl=$('vos-gap'), gapSub=$('vos-gap-sub'),
        aUnitEl=$('vos-a-unit'), aLbEl=$('vos-a-lb'),
        bUnitEl=$('vos-b-unit'), bLbEl=$('vos-b-lb'),
        tip=$('vos-tip-text');

    var DEFAULTS={'vos-a-price':24,'vos-a-units':12,'vos-a-size':2,'vos-b-price':40,'vos-b-units':24,'vos-b-size':1.5};

    function num(el){ var v=parseFloat(el.value); return isFinite(v)&&v>0?v:0; }
    function money2(n){
      if(!isFinite(n)) return '--';
      return (n<0?'-$':'$')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    }

    function calc(){
      var aP=num(aPrice), aU=num(aUnits), aS=num(aSize),
          bP=num(bPrice), bU=num(bUnits), bS=num(bSize);

      var aUnit = aU>0 ? aP/aU : NaN;
      var bUnit = bU>0 ? bP/bU : NaN;
      var aLb = (aU>0&&aS>0) ? aP/(aU*aS) : NaN;
      var bLb = (bU>0&&bS>0) ? bP/(bU*bS) : NaN;

      aUnitEl.textContent = money2(aUnit);
      aLbEl.textContent   = money2(aLb);
      bUnitEl.textContent = money2(bUnit);
      bLbEl.textContent   = money2(bLb);

      // Prefer the per-pound comparison; fall back to per-unit if weights are missing.
      var basis, aVal, bVal, unitWord;
      if(isFinite(aLb) && isFinite(bLb)){ basis='lb'; aVal=aLb; bVal=bLb; unitWord='per lb'; }
      else if(isFinite(aUnit) && isFinite(bUnit)){ basis='unit'; aVal=aUnit; bVal=bUnit; unitWord='per unit'; }
      else { basis=null; }

      if(!basis){
        bestEl.textContent='--'; bestSub.textContent='Enter price and units for both options';
        gapEl.textContent='--'; gapSub.textContent='';
        tip.innerHTML='Enter the <b>price</b> and <b>units</b> for both packs, and a <b>net weight</b> if you want the per pound comparison.';
        return;
      }

      var winner, wVal, lVal;
      if(Math.abs(aVal-bVal) < 1e-9){
        bestEl.textContent='Either';
        bestSub.textContent='Both cost '+money2(aVal)+' '+unitWord;
        gapEl.textContent='0.0%'; gapSub.textContent='No difference '+unitWord;
        tip.innerHTML='Both packs land at <b>'+money2(aVal)+'</b> '+unitWord+', so on cost alone it is a wash. Decide on shelf life, storage or how fast each moves.';
        return;
      }
      if(aVal < bVal){ winner='Option A'; wVal=aVal; lVal=bVal; } else { winner='Option B'; wVal=bVal; lVal=aVal; }
      var pct = lVal>0 ? (lVal-wVal)/lVal*100 : 0;
      var dollar = lVal-wVal;

      bestEl.textContent = winner;
      bestSub.textContent = money2(wVal)+' '+unitWord+' vs '+money2(lVal);
      gapEl.textContent = pct.toFixed(1)+'%';
      gapSub.textContent = money2(dollar)+' '+unitWord+' versus the other pack';

      // Teaching case: the per-unit winner differs from the per-pound winner.
      var perUnitWinner = (isFinite(aUnit)&&isFinite(bUnit)) ? (aUnit<bUnit?'Option A':(bUnit<aUnit?'Option B':'')) : '';
      if(basis==='lb' && perUnitWinner && perUnitWinner!==winner){
        var cheaperUnit = perUnitWinner==='Option A'?aUnit:bUnit;
        var dearerUnit  = perUnitWinner==='Option A'?bUnit:aUnit;
        tip.innerHTML = perUnitWinner+' is cheaper per unit at <b>'+money2(cheaperUnit)+'</b> versus <b>'+money2(dearerUnit)+'</b>, but its units are smaller. Per pound, Option A costs <b>'+money2(aLb)+'</b> and Option B costs <b>'+money2(bLb)+'</b>, so '+winner.replace('Option ','')+' is the better buy by <b>'+pct.toFixed(1)+'%</b>. The pack that looks cheaper per unit is not always cheaper per pound.';
      } else {
        tip.innerHTML = winner+' is the better buy at <b>'+money2(wVal)+'</b> '+unitWord+' versus <b>'+money2(lVal)+'</b>, about <b>'+pct.toFixed(1)+'%</b> less. Always compare '+unitWord+', not by the price on the case.';
      }
    }

    [aPrice,aUnits,aSize,bPrice,bUnits,bSize].forEach(function(el){ el.addEventListener('input', calc); });

    $('vos-reset').addEventListener('click', function(){
      Object.keys(DEFAULTS).forEach(function(id){ $(id).value = DEFAULTS[id]; });
      calc();
    });

    calc();
  })();
  </script>
