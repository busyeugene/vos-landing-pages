  <style>
    /* ── Reset & Base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #1a1a1a;
      background: #fff;
      line-height: 1.6;
    }

    /* ── Brand Tokens ─────────────────────────────────────────── */
    :root {
      --color-primary:     #2D1B6E;   /* Deep purple – VOS brand */
      --color-accent:      #0BB5E0;   /* Bright cyan-blue – stats, CTAs */
      --color-accent-hover:#0998C0;
      --color-light-bg:    #f5f7fa;
      --color-mid-bg:      #eef0f4;
      --color-dark-bg:     #2D1B6E;
      --color-text:        #1a1a1a;
      --color-text-muted:  #5a6478;
      --color-white:       #ffffff;
      --radius:            8px;
      --max-width:         1160px;
      --section-pad:       80px 24px;
    }

    /* ── Layout Helpers ───────────────────────────────────────── */
    .container   { max-width: var(--max-width); margin: 0 auto; padding: 0 24px; }
    .section-pad { padding: var(--section-pad); }
    .text-center { text-align: center; }
    .text-muted  { color: var(--color-text-muted); }
    .bg-light    { background: var(--color-light-bg); }
    .bg-mid      { background: var(--color-mid-bg); }
    .bg-dark     { background: var(--color-dark-bg); color: var(--color-white); }

    /* ── Typography ───────────────────────────────────────────── */
    h1 { font-size: clamp(32px, 5vw, 56px); font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; }
    h2 { font-size: clamp(26px, 4vw, 42px); font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; }
    h3 { font-size: clamp(18px, 2.5vw, 26px); font-weight: 600; line-height: 1.25; }
    h4 { font-size: 18px; font-weight: 600; }
    p  { font-size: 17px; line-height: 1.7; }
    .eyebrow {
      display: inline-block;
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: 12px;
    }
    .lead { font-size: 20px; line-height: 1.6; color: var(--color-text-muted); max-width: 620px; }

    /* ── Buttons ──────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 28px; border-radius: var(--radius);
      font-size: 16px; font-weight: 600; text-decoration: none;
      transition: background 0.2s, transform 0.1s;
      cursor: pointer; border: none;
    }
    .btn-primary { background: #111827; color: var(--color-white); }
    .btn-primary:hover { background: #1f2937; transform: translateY(-1px); }
    .btn-outline {
      background: transparent; color: var(--color-primary);
      border: 2px solid var(--color-primary);
    }
    .btn-outline-white {
      background: transparent; color: var(--color-white);
      border: 2px solid rgba(255,255,255,0.6);
    }
    .btn-outline:hover      { background: var(--color-primary); color: #fff; }
    .btn-outline-white:hover { border-color: #fff; background: rgba(255,255,255,0.15); }
    .btn-lg { padding: 18px 36px; font-size: 17px; }

    /* ── Image Placeholder ─────────────────────────────────────── */
    .img-placeholder {
      background: linear-gradient(135deg, #dde3ed 0%, #c8d0de 100%);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      color: #8a93a6; font-size: 14px; font-weight: 500; text-align: center;
      padding: 24px; min-height: 320px;
      border: 1px solid #cdd3de;
    }
    .img-placeholder.tall { min-height: 440px; }

    /* ── Navbar ───────────────────────────────────────────────── */
    .navbar {
      position: sticky; top: 0; z-index: 100;
      background: var(--color-white);
      border-bottom: 1px solid #e4e7ed;
      padding: 0 24px;
    }
    .navbar-inner {
      max-width: var(--max-width); margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      height: 68px; gap: 24px;
    }
    .navbar-logo {
      font-size: 18px; font-weight: 800; color: var(--color-primary);
      text-decoration: none; letter-spacing: -0.02em;
    }
    .navbar-logo span { color: var(--color-accent); }
    .navbar-links { display: flex; gap: 28px; list-style: none; }
    .navbar-links a {
      color: var(--color-text-muted); text-decoration: none;
      font-size: 14px; font-weight: 500; transition: color 0.2s;
    }
    .navbar-links a:hover { color: var(--color-primary); }
    .navbar-cta { display: flex; gap: 10px; }
    @media (max-width: 768px) { .navbar-links { display: none; } }

    /* ── Hero ─────────────────────────────────────────────────── */
    .hero {
      background: linear-gradient(135deg, #4A1FA8 0%, #1354CC 100%);
      color: var(--color-white);
      padding: 96px 24px 80px;
    }
    .hero-grid {
      max-width: var(--max-width); margin: 0 auto;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 60px; align-items: center;
    }
    .hero h1 { color: var(--color-white); margin-bottom: 20px; }
    .hero .lead { color: rgba(255,255,255,0.8); margin-bottom: 36px; }
    .hero-ctas { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 40px; }
    .hero-trust {
      display: flex; align-items: center; gap: 12px;
      font-size: 13px; color: rgba(255,255,255,0.55); flex-wrap: wrap;
    }
    .hero-trust-dot {
      width: 4px; height: 4px; border-radius: 50%;
      background: rgba(255,255,255,0.3);
    }
    @media (max-width: 900px) {
      .hero-grid { grid-template-columns: 1fr; }
      .hero { padding: 64px 24px 56px; }
    }

    /* ── Logo Bar ─────────────────────────────────────────────── */
    .logo-bar { padding: 36px 24px; border-bottom: 1px solid #e8eaed; }
    .logo-bar-inner {
      max-width: var(--max-width); margin: 0 auto;
      display: flex; align-items: center; justify-content: center;
      flex-wrap: wrap; gap: 40px;
    }
    .logo-bar-label { font-size: 13px; color: var(--color-text-muted); font-weight: 500; white-space: nowrap; }
    .logo-slot {
      background: #e8eaed; border-radius: 6px;
      width: 110px; height: 36px; display: flex;
      align-items: center; justify-content: center;
      font-size: 12px; color: #9aa0ad;
    }

    /* ── Stats Strip ──────────────────────────────────────────── */
    .stats-strip { background: var(--color-accent); padding: 48px 24px; }
    .stats-grid {
      max-width: var(--max-width); margin: 0 auto;
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 24px; text-align: center;
    }
    .stat-number {
      font-size: clamp(36px, 5vw, 56px); font-weight: 800;
      color: var(--color-white); line-height: 1; margin-bottom: 8px;
    }
    .stat-label { font-size: 15px; color: rgba(255,255,255,0.9); }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: 1fr; } }

    /* ── Problem Section ──────────────────────────────────────── */
    .problem-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 28px; margin-top: 48px;
    }
    .problem-card {
      background: var(--color-white);
      border: 1px solid #e4e7ed; border-radius: 12px; padding: 28px;
    }
    .problem-icon {
      width: 48px; height: 48px; border-radius: 10px;
      background: #ede9fe; display: flex; align-items: center;
      justify-content: center; margin-bottom: 16px; font-size: 22px;
    }
    @media (max-width: 768px) { .problem-grid { grid-template-columns: 1fr; } }

    /* ── Feature Alternating Rows ────────────────────────────── */
    .feature-row {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 72px; align-items: center;
      max-width: var(--max-width); margin: 0 auto;
    }
    .feature-row.reverse { direction: rtl; }
    .feature-row.reverse > * { direction: ltr; }
    .feature-bullets { list-style: none; margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
    .feature-bullets li { display: flex; align-items: flex-start; gap: 12px; font-size: 16px; }
    .bullet-check {
      flex-shrink: 0; width: 22px; height: 22px;
      background: #e0f7fd; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--color-accent); font-size: 12px; margin-top: 2px;
    }
    .feature-link {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 24px; color: var(--color-accent);
      font-weight: 600; font-size: 15px; text-decoration: none;
    }
    .feature-link:hover { text-decoration: underline; }
    @media (max-width: 900px) {
      .feature-row, .feature-row.reverse { grid-template-columns: 1fr; direction: ltr; gap: 36px; }
    }

    /* ── Feature Cards Grid ───────────────────────────────────── */
    .cards-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 24px; margin-top: 48px;
    }
    .feature-card {
      border: 1px solid #e4e7ed; border-radius: 12px; padding: 28px;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .feature-card:hover { box-shadow: 0 8px 30px rgba(0,0,0,0.08); transform: translateY(-2px); }
    .feature-card-icon {
      width: 52px; height: 52px; border-radius: 12px;
      background: var(--color-light-bg); display: flex;
      align-items: center; justify-content: center;
      font-size: 24px; margin-bottom: 18px;
    }
    @media (max-width: 900px) { .cards-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 580px) { .cards-grid { grid-template-columns: 1fr; } }

    /* ── How It Works ─────────────────────────────────────────── */
    .steps-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 32px; margin-top: 48px; position: relative;
    }
    .step-card { text-align: center; padding: 0 16px; }
    .step-number {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--color-accent); color: #fff;
      font-size: 22px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }
    @media (max-width: 700px) { .steps-grid { grid-template-columns: 1fr; } }

    /* ── Testimonials ─────────────────────────────────────────── */
    .testimonials-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 24px; margin-top: 48px;
    }
    .testimonial-card {
      background: var(--color-white);
      border: 1px solid #e4e7ed; border-radius: 12px; padding: 32px;
    }
    .testimonial-card.featured {
      background: var(--color-primary); color: var(--color-white);
      border-color: transparent;
    }
    .testimonial-stars { color: #f5a623; font-size: 18px; margin-bottom: 16px; }
    .testimonial-quote { font-size: 17px; line-height: 1.65; margin-bottom: 24px; }
    .testimonial-author { display: flex; align-items: center; gap: 14px; }
    .author-avatar {
      width: 46px; height: 46px; border-radius: 50%;
      background: #dde3ed; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #8a93a6;
    }
    .author-name { font-weight: 600; font-size: 15px; }
    .author-role { font-size: 13px; color: var(--color-text-muted); }
    .testimonial-card.featured .author-role { color: rgba(255,255,255,0.6); }
    @media (max-width: 700px) { .testimonials-grid { grid-template-columns: 1fr; } }

    /* ── Integrations ─────────────────────────────────────────── */
    .integrations-logos {
      display: flex; flex-wrap: wrap; gap: 16px;
      justify-content: center; margin-top: 40px;
    }
    .integration-badge {
      background: var(--color-white);
      border: 1px solid #e4e7ed; border-radius: 10px;
      padding: 14px 24px; display: flex;
      align-items: center; gap: 10px;
      font-size: 14px; font-weight: 600; color: var(--color-text);
    }
    .integration-logo-placeholder {
      width: 28px; height: 28px; background: #dde3ed;
      border-radius: 6px; flex-shrink: 0;
    }

    /* ── Comparison Table ─────────────────────────────────────── */
    .comparison-table {
      width: 100%; border-collapse: collapse;
      margin-top: 48px; border-radius: 12px; overflow: hidden;
      border: 1px solid #e4e7ed;
    }
    .comparison-table th {
      background: var(--color-primary); color: #fff;
      padding: 18px 24px; font-size: 15px; text-align: left;
    }
    .comparison-table th.highlight { background: var(--color-accent); }
    .comparison-table td { padding: 16px 24px; border-bottom: 1px solid #e8eaed; font-size: 15px; }
    .comparison-table tr:last-child td { border-bottom: none; }
    .comparison-table tr:nth-child(even) td { background: var(--color-light-bg); }
    .check-yes { color: #2a9d48; font-size: 18px; font-weight: 700; }
    .check-no  { color: #c0c4cc; font-size: 18px; }

    /* ── FAQ ──────────────────────────────────────────────────── */
    .faq-list { margin-top: 48px; display: flex; flex-direction: column; gap: 4px; }
    .faq-item { border: 1px solid #e4e7ed; border-radius: var(--radius); overflow: hidden; }
    .faq-question {
      width: 100%; background: var(--color-white); border: none; padding: 22px 28px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 17px; font-weight: 600; text-align: left;
      cursor: pointer; color: var(--color-text);
    }
    .faq-question:hover { background: var(--color-light-bg); }
    .faq-icon { font-size: 22px; color: var(--color-text-muted); flex-shrink: 0; }
    .faq-answer {
      padding: 0 28px 22px;
      font-size: 16px; color: var(--color-text-muted); line-height: 1.7;
      background: var(--color-white);
    }

    /* ── Final CTA ─────────────────────────────────────────────── */
    .final-cta {
      background: linear-gradient(135deg, #4A1FA8 0%, #1354CC 100%);
      color: var(--color-white); padding: 100px 24px; text-align: center;
    }
    .final-cta h2 { color: var(--color-white); max-width: 640px; margin: 0 auto 16px; }
    .final-cta p  { color: rgba(255,255,255,0.75); font-size: 18px; margin-bottom: 36px; }
    .final-cta-form {
      display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px;
    }
    .final-cta-form input {
      padding: 16px 20px; border-radius: var(--radius); border: none;
      font-size: 16px; width: 280px; max-width: 100%;
    }
    .final-cta-trust {
      font-size: 13px; color: rgba(255,255,255,0.5);
      display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;
    }

    /* ── Footer ───────────────────────────────────────────────── */
    .footer { background: #1a0f47; color: rgba(255,255,255,0.6); padding: 60px 24px 32px; }
    .footer-grid {
      max-width: var(--max-width); margin: 0 auto;
      display: grid; grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 40px; margin-bottom: 48px;
    }
    .footer-brand-name { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 12px; }
    .footer-brand-name span { color: var(--color-accent); }
    .footer-tagline { font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
    .footer-col h5 {
      color: #fff; font-size: 13px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 16px;
    }
    .footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .footer-col ul a { color: rgba(255,255,255,0.55); text-decoration: none; font-size: 14px; }
    .footer-col ul a:hover { color: #fff; }
    .footer-bottom {
      max-width: var(--max-width); margin: 0 auto;
      border-top: 1px solid rgba(255,255,255,0.08); padding-top: 24px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; flex-wrap: wrap; gap: 12px;
    }
    @media (max-width: 768px) { .footer-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 480px) { .footer-grid { grid-template-columns: 1fr; } }

    /* ── Utilities ────────────────────────────────────────────── */
    .mt-12 { margin-top: 12px; }
    .mt-16 { margin-top: 16px; }
    .mt-24 { margin-top: 24px; }
    .mt-32 { margin-top: 32px; }
    .mt-48 { margin-top: 48px; }
    .mb-8  { margin-bottom: 8px; }
    .mb-16 { margin-bottom: 16px; }
    .gap-8 { gap: 8px; }
  </style>
